{% extends "base.html" %}
{% block title %}Sign Up{% endblock %}

{% block extra_head %}
<style>
.auth-wrap {
  min-height: calc(100vh - 60px); display: flex; align-items: center; justify-content: center;
  padding: 2rem;
  background: radial-gradient(ellipse 80% 60% at 50% -10%, rgba(99,102,241,0.12), transparent);
}
.auth-box { width: 100%; max-width: 460px; }
.auth-logo { text-align: center; margin-bottom: 2rem; }
.auth-logo-mark {
  width: 56px; height: 56px; border-radius: 16px;
  background: var(--accent); margin: 0 auto 1rem;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.8rem; font-weight: 900; font-family: var(--font-head); color: #fff;
  box-shadow: 0 0 40px rgba(99,102,241,0.4);
}
.auth-title { font-size: 1.6rem; font-weight: 800; }
.auth-sub   { color: var(--text-muted); font-size: 0.875rem; margin-top: 4px; }
.grid-2-form { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
</style>
{% endblock %}

{% block content %}
<div class="auth-wrap">
  <div class="auth-box">
    <div class="auth-logo">
      <div class="auth-logo-mark">P</div>
      <div class="auth-title">Start your journey</div>
      <div class="auth-sub">AI-powered learning paths, personalized for you</div>
    </div>

    <div class="card">
      <form method="POST" action="{{ url_for('auth.signup') }}">
        <div class="form-group">
          <label class="form-label">Full Name</label>
          <input type="text" name="full_name" class="form-control"
                 placeholder="Jane Smith" value="{{ full_name or '' }}">
        </div>
        <div class="grid-2-form">
          <div class="form-group">
            <label class="form-label">Username</label>
            <input type="text" name="username" class="form-control"
                   placeholder="janesmith" value="{{ username or '' }}" required>
          </div>
          <div class="form-group">
            <label class="form-label">Email</label>
            <input type="email" name="email" class="form-control"
                   placeholder="you@example.com" value="{{ email or '' }}" required>
          </div>
        </div>
        <div class="grid-2-form">
          <div class="form-group">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control"
                   placeholder="Min. 6 characters" required>
          </div>
          <div class="form-group">
            <label class="form-label">Confirm Password</label>
            <input type="password" name="confirm_password" class="form-control"
                   placeholder="Repeat password" required>
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-full btn-lg mt-2">
          Create Account →
        </button>
      </form>
      <div class="divider-text mt-3"><span>Already have an account?</span></div>
      <a href="{{ url_for('auth.login') }}" class="btn btn-secondary btn-full">Sign in</a>
    </div>
  </div>
</div>
{% endblock %}
