{% extends "base.html" %}
{% block title %}Login{% endblock %}

{% block extra_head %}
<style>
.auth-wrap {
  min-height: calc(100vh - 60px);
  display: flex; align-items: center; justify-content: center;
  padding: 2rem;
  background: radial-gradient(ellipse 80% 60% at 50% -10%, rgba(99,102,241,0.12), transparent);
}
.auth-box { width: 100%; max-width: 420px; }
.auth-logo { text-align: center; margin-bottom: 2rem; }
.auth-logo-mark {
  width: 56px; height: 56px; border-radius: 16px;
  background: var(--accent); margin: 0 auto 1rem;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.8rem; font-weight: 900; font-family: var(--font-head); color: #fff;
  box-shadow: 0 0 40px rgba(99,102,241,0.4);
}
.auth-title { font-size: 1.6rem; font-weight: 800; }
.auth-sub   { color: var(--text-muted); font-size: 0.875rem; margin-top: 4px; }
</style>
{% endblock %}

{% block content %}
<div class="auth-wrap">
  <div class="auth-box">
    <div class="auth-logo">
      <div class="auth-logo-mark">P</div>
      <div class="auth-title">Welcome back</div>
      <div class="auth-sub">Sign in to continue your learning journey</div>
    </div>

    <div class="card">
      <form method="POST" action="{{ url_for('auth.login') }}">
        <div class="form-group">
          <label class="form-label">Username or Email</label>
          <input type="text" name="identifier" class="form-control"
                 placeholder="you@example.com" required autofocus>
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" name="password" class="form-control"
                 placeholder="••••••••" required>
        </div>
        <div class="form-group" style="display:flex;align-items:center;gap:8px;">
          <input type="checkbox" name="remember" id="remember" style="accent-color:var(--accent);">
          <label for="remember" style="font-size:0.85rem;color:var(--text-muted);cursor:pointer;">Remember me</label>
        </div>
        <button type="submit" class="btn btn-primary btn-full btn-lg mt-2">
          Sign In →
        </button>
      </form>
      <div class="divider-text mt-3"><span>New here?</span></div>
      <a href="{{ url_for('auth.signup') }}" class="btn btn-secondary btn-full">
        Create an account
      </a>
    </div>
  </div>
</div>
{% endblock %}
